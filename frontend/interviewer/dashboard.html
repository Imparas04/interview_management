<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Interviews — RecruitOS Interviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-role="interviewer" data-page="dashboard">
<div id="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="content">
      <div class="page-head">
        <div>
          <h1>My interviews</h1>
          <p>Interviews assigned to you, upcoming first.</p>
        </div>
      </div>

      <div class="chip-filter-bar">
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option value="">All</option>
            <option value="scheduled">Scheduled</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="rescheduled">Rescheduled</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <button class="btn btn-outline btn-sm" id="filter-btn">Apply</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Candidate</th><th>Job</th><th>Round</th><th>When</th><th>Status</th><th></th></tr></thead>
          <tbody id="iv-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/router-guard.js"></script>
<script src="../js/pages/interviewer-dashboard.js"></script>
</body>
</html>
