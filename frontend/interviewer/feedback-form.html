<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit feedback — RecruitOS Interviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-role="interviewer" data-page="dashboard">
<div id="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="content" style="max-width:640px;">
      <div class="page-head">
        <div>
          <h1>Submit feedback</h1>
          <p id="iv-context">Loading interview…</p>
        </div>
        <a href="dashboard.html" class="btn btn-outline">&larr; My interviews</a>
      </div>

      <div class="card">
        <div class="form-error-banner" id="form-error"></div>
        <form id="feedback-form">
          <input type="hidden" id="interview-id">
          <div class="field-row">
            <div class="field"><label>Technical knowledge (0–10)</label><input type="number" id="f-technical" min="0" max="10" required></div>
            <div class="field"><label>Communication (0–10)</label><input type="number" id="f-communication" min="0" max="10" required></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Problem solving (0–10)</label><input type="number" id="f-problem" min="0" max="10" required></div>
            <div class="field"><label>Coding (0–10)</label><input type="number" id="f-coding" min="0" max="10" required></div>
          </div>
          <div class="field">
            <label>Confidence (0–10)</label>
            <input type="number" id="f-confidence" min="0" max="10" required>
          </div>
          <div class="field">
            <label for="f-recommendation">Recommendation</label>
            <select id="f-recommendation" required>
              <option value="next_round">Move to next round</option>
              <option value="select">Select</option>
              <option value="reject">Reject</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">Submit feedback</button>
          <div class="hint">Submitting marks this interview as completed. You can only submit once.</div>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/router-guard.js"></script>
<script src="../js/pages/interviewer-feedback.js"></script>
</body>
</html>
