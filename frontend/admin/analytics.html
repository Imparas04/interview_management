<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics — RecruitOS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body data-role="admin" data-page="analytics">
<div id="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="content">
      <div class="page-head">
        <div>
          <h1>Analytics</h1>
          <p>Department distribution and full pipeline funnel.</p>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <h3>Candidates by department</h3>
          <canvas id="dept-bar" height="240"></canvas>
        </div>
        <div class="chart-card">
          <h3>Pipeline funnel</h3>
          <canvas id="funnel-chart" height="240"></canvas>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Department</th><th>Candidates</th></tr></thead>
          <tbody id="dept-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/router-guard.js"></script>
<script src="../js/pages/admin-analytics.js"></script>
</body>
</html>
