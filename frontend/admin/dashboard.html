<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — RecruitOS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body data-role="admin" data-page="dashboard">
<div id="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="content">
      <div class="page-head">
        <div>
          <h1>Overview</h1>
          <p>Recruitment pipeline at a glance.</p>
        </div>
      </div>

      <div class="stat-grid" id="stat-grid">
        <div class="stat-card"><div class="label">Total candidates</div><div class="value">—</div></div>
        <div class="stat-card accent-gold"><div class="label">Shortlisted</div><div class="value">—</div></div>
        <div class="stat-card accent-info"><div class="label">Interviews scheduled</div><div class="value">—</div></div>
        <div class="stat-card accent-success"><div class="label">Selected</div><div class="value">—</div></div>
        <div class="stat-card accent-warn"><div class="label">Rejected</div><div class="value">—</div></div>
        <div class="stat-card"><div class="label">Pending</div><div class="value">—</div></div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <h3>Candidates by department</h3>
          <canvas id="dept-chart" height="230"></canvas>
        </div>
        <div class="chart-card">
          <h3>Pipeline status</h3>
          <canvas id="status-chart" height="230"></canvas>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/router-guard.js"></script>
<script src="../js/pages/admin-dashboard.js"></script>
</body>
</html>
