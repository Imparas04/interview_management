<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile — RecruitOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-role="candidate" data-page="profile">
<div id="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="content">
      <div class="page-head">
        <div>
          <h1>My profile</h1>
          <p>Keep this current — it's what recruiters see alongside your resume.</p>
        </div>
      </div>

      <div class="chart-grid">
        <div class="card">
          <h3>Edit details</h3>
          <div class="form-error-banner" id="form-error"></div>
          <form id="profile-form">
            <div class="field-row">
              <div class="field"><label for="f-phone">Phone</label><input type="text" id="f-phone"></div>
              <div class="field"><label for="f-dob">Date of birth</label><input type="date" id="f-dob"></div>
            </div>
            <div class="field"><label for="f-address">Address</label><input type="text" id="f-address"></div>
            <div class="field"><label for="f-summary">Summary</label><textarea id="f-summary" placeholder="A couple of lines about your background…"></textarea></div>
            <div class="field-row">
              <div class="field"><label for="f-linkedin">LinkedIn URL</label><input type="url" id="f-linkedin"></div>
              <div class="field"><label for="f-portfolio">Portfolio URL</label><input type="url" id="f-portfolio"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="save-btn">Save changes</button>
          </form>
        </div>

        <div class="card">
          <h3>Recommended department</h3>
          <div id="dept-rec-body" class="loading-row"><span class="spinner"></span>Loading…</div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/router-guard.js"></script>
<script src="../js/pages/candidate-profile.js"></script>
</body>
</html>
