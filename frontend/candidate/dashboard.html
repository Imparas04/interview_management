<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — RecruitOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-role="candidate" data-page="dashboard">
<div id="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="content">
      <div class="page-head">
        <div>
          <h1 id="welcome-head">Welcome back</h1>
          <p>Here's where your applications stand.</p>
        </div>
        <a href="jobs.html" class="btn btn-primary">Browse jobs</a>
      </div>

      <div class="stat-grid" id="stat-grid">
        <div class="stat-card"><div class="label">Jobs applied</div><div class="value">—</div></div>
        <div class="stat-card accent-gold"><div class="label">Shortlisted</div><div class="value">—</div></div>
        <div class="stat-card accent-info"><div class="label">Interviews</div><div class="value">—</div></div>
        <div class="stat-card accent-success"><div class="label">Completed interviews</div><div class="value">—</div></div>
      </div>

      <div class="page-head" style="margin-top:6px;">
        <h2>Recent applications</h2>
        <a href="applications.html" class="btn btn-outline btn-sm">View all</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Job</th><th>Department</th><th>Status</th><th>Applied</th></tr></thead>
          <tbody id="app-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/router-guard.js"></script>
<script src="../js/pages/candidate-dashboard.js"></script>
</body>
</html>
