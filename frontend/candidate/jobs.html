<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Jobs — RecruitOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-role="candidate" data-page="jobs">
<div id="app">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="content">
      <div class="page-head">
        <div>
          <h1>Browse jobs</h1>
          <p>Open positions you can apply to right now.</p>
        </div>
      </div>

      <div class="chip-filter-bar">
        <div class="field">
          <label>Department</label>
          <select id="f-department"><option value="">All</option></select>
        </div>
        <div class="field">
          <label>Search</label>
          <input type="search" id="f-search" placeholder="Title, keyword…">
        </div>
        <button class="btn btn-outline btn-sm" id="filter-btn">Apply filters</button>
      </div>

      <div id="jobs-list"></div>
    </main>
  </div>
</div>

<!-- Apply modal -->
<div class="modal-overlay" id="apply-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="apply-modal-title">Apply</h2>
      <button class="modal-close" onclick="closeModal('apply-modal')">&times;</button>
    </div>
    <div class="form-error-banner" id="apply-error"></div>
    <div class="field">
      <label for="apply-resume">Resume to submit</label>
      <select id="apply-resume"></select>
      <div class="hint">No resume listed? Upload one from the Resume page first.</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('apply-modal')">Cancel</button>
      <button class="btn btn-primary" id="apply-submit-btn">Submit application</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/router-guard.js"></script>
<script src="../js/pages/candidate-jobs.js"></script>
</body>
</html>
